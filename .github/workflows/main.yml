# Trading Strategy Center — CI/CD Pipeline
name: CI/CD

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  # ─── Python 测试 ──────────────────────────────────────────────────
  test-python:
    name: "Python Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading_pass
          POSTGRES_DB: trading_strategy_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_strategy_center"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      SQLALCHEMY_URL: postgresql+asyncpg://trading:trading_pass@localhost:5432/trading_strategy_center
      DB_USER: trading
      DB_PASS: trading_pass
      DB_NAME: trading_strategy_center
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply PostgreSQL schema
        run: alembic upgrade head

      - name: Verify Agent 3.0 release gate
        run: python scripts/verify_agent_release.py

      - name: Run unit tests
        run: python -m pytest tests/unit/ -x --tb=short -v --timeout=60

      - name: Run integration tests
        run: python -m pytest tests/integration/ -x --tb=short -v --timeout=60

      - name: Check Python syntax
        run: |
          python -m compileall -q core/ tests/ api/ tournament/

      - name: Ruff correctness checks
        run: ruff check core/ tests/ api/ tournament/ --select E9,F63,F7

      - name: Verify alpha factors
        run: |
          python -c "
          from core.alpha.alpha101.factor_registry import FactorRegistry
          FactorRegistry.ensure_initialized()
          names = FactorRegistry.list_all()
          print(f'Alpha factors registered: {len(names)}')
          assert len(names) >= 101, f'Expected >=101, got {len(names)}'
          "

  # ─── 前端构建 ────────────────────────────────────────────────────
  build-frontend:
    name: "Frontend Build (Node 20)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check frontend types and routes
        run: |
          npm run tsc:check
          npm run lint:check
          npm run route:check

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  security:
    name: "Security Gates"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83" wheel pip-audit
          python -m pip install -e .
          pip-audit --local --progress-spinner=off

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  # ─── Docker 构建 (仅 push 到 main) ──────────────────────────────
  docker-build:
    name: "Docker Build"
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [test-python, build-frontend, security]
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: trading-strategy-center:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to DockerHub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Publish image
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/trading-strategy-center:latest
            ${{ secrets.DOCKER_USERNAME }}/trading-strategy-center:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 检查 Python 打包 ───────────────────────────────────────────
  check-package:
    name: "Python Packaging Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check pyproject.toml
        run: |
          pip install build twine
          python -m build --sdist --wheel
          twine check dist/*
      - name: Verify setup
        run: |
          pip install -e .
          python -c "import core; print('Package OK:', core.__name__)"
