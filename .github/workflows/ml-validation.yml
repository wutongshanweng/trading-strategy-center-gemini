name: Heavy ML Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ml:
    name: HMM, Torch, TensorFlow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ML and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Verify heavy frameworks
        run: |
          python -c "import arch, hmmlearn, tensorflow, torch; print('ML framework imports OK')"

      - name: Run ML unit and integration tests
        run: >-
          python -m pytest -q --timeout=120
          tests/unit/test_ml_auto_advisor.py
          tests/unit/test_ml_features.py
          tests/unit/test_ml_pipeline.py
          tests/unit/test_ml_registry.py
          tests/integration/test_intelligence_upgrade.py
