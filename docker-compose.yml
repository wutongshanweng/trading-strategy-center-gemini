services:
  app:
    image: trading-strategy-center:local
    build:
      context: .
      args:
        INSTALL_EXTRAS: ""
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      ENV: development
      HOST: 127.0.0.1
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes: [./logs:/app/logs]
    restart: unless-stopped
    networks: [trading-net]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-trading}
      POSTGRES_PASSWORD: ${DB_PASS:-trading_pass}
      POSTGRES_DB: ${DB_NAME:-trading_strategy_center}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trading}"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped
    networks: [trading-net]

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5 }
    restart: unless-stopped
    networks: [trading-net]

  celery_worker:
    image: trading-strategy-center:local
    build:
      context: .
      args:
        INSTALL_EXTRAS: ""
    command: celery -A tasks.celery_app worker -Q celery,backtest,training --loglevel=info --concurrency=2
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes: [./logs:/app/logs]
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [trading-net]

  celery_beat:
    image: trading-strategy-center:local
    build:
      context: .
      args:
        INSTALL_EXTRAS: ""
    command: celery -A tasks.celery_app beat --loglevel=info
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes: [./logs:/app/logs]
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [trading-net]

  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:80:80"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [app]
    restart: unless-stopped
    networks: [trading-net]

volumes: { postgres_data: {}, redis_data: {} }
networks: { trading-net: { driver: bridge } }
